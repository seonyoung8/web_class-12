<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값의 형태로 정의하는 함수</title>
</head>
<body>
    <script>
        a()
        function a(){
            alert("aaa");
        } //함수 선언문으로 정의된 함수는 코드의 어디에서든지 호출이 가능하다.
        let b = function(){
            alert("bbb")
        }
        b()  //변수가 선언되고 할당 되는 순간까지 함수는 정의되지 않기 때문에 b()를 먼저 실행하면 에러가 발생한다.
        let c= () => {
            alert("ccc")
        } //화살표함수, c를 실행해라
        c()

        function d(n1){
            alert(n1)
        }
        d("ddd")
        
        let e = function(n1){
            alert(n1)
        }
        e("eee")

        let f = n1 => {
            alert(n1)
        } //매개변수가 하나일 때는 () 생략 가능
        f("fff")

        let g = (a,b) =>[a,b]
        //let g = (a,b) => a+b 매개변수가 2개 이상일 때는 함수의 실행문이 하나일 때는 {}와 return 생략 가능하다.
        alert(g(1,3))
    </script>
        <h1>콜백 함수</h1>
    <script>
        function aa(bb){
            bb()
        }
        aa(function(){
            alert("TT")
        })

        let cc=dd=>{
            dd()
        }//cc라는 함수는 dd라는 매개변수를 받아서 dd()를 실행하는 함수
        cc(function(){
            dd()
        })//익명함수 형태로 콜백함수를 전달, 내부적으로 정의 
        cc(() => {
            alert("dd")
        })
        </script>
</body>
</html>
