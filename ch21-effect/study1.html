<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효과</title>
    <link rel="stylesheet" href="./css/study1.css">
</head>
<body>
    <h1>box-shadow</h1>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <h1>filter</h1>
    <figure>
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>원본</figcaption>
    </figure>
    <figure class="filter1">
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>grayscale(1)</figcaption>
    </figure>
        <figure class="filter2">
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>brightness(1)</figcaption>
    </figure>
    </figure>
        <figure class="filter3">
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>blur(20px)</figcaption>
    </figure>  
    </figure>
        <figure class="filter4">
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>hue-rotate(180deg)</figcaption>
    </figure>
    <h1>mix-blend-mode</h1>
    <div class="bg">
    <figure class="blend1">
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>color-burn</figcaption>
    </figure> 
    <figure class="blend2">
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>diffrence</figcaption>
    </figure> 
    <figure class="blend3">
        <img src="./img/lolame-fish.jpg" alt="물고기">
        <figcaption>overlay</figcaption>
    </figure> 
    </div>
</body>
</html>
