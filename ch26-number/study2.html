<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학관련도구(함수)</title>
</head>
<body>
    <h1>수학 계산 함수</h1>
    <script>
        console.log(Math.ceil(5.33)) //올림 처리 6
        console.log(Math.floor(5.9)) //내림 처리 5
        console.log(Math.round(5.5)) //반올림 처리 6
        console.log(Math.pow(10.3)) //10을 3번 곱하기 1000
        console.log(Math.sqrt(100)) //100에 루트 10
        console.log(Math.abs(-30)) //절대 값 30
        console.log(Math.max(1,2,3,4,5,6)) //괄호 안의 숫자 중 최대 6
        colsole.log(Math.min(1,2,3)) // 괄호 안의 숫자 중 최소 1
        console.log(Math.random()) //0에서 1사이의 소수자리 랜덤 수
        console.log(123.333231423.toFixed(3)) //소수점 ()자리까지 표현 문자데이터로 변환
    </script>
</body>
</html>
