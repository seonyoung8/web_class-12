    <title>생성자 함수</title>
    <p>생성자 함수란? 객체를 생성하는 함수를 뜻한다.</p>

<body>

    <p>생성자 함수란? 객체를 생성하는 함수를 뜻한다.</p>
    <script>
        function Person(uname, age) {
            this.name = uname
            this.age = uage
            this.sayhello = function(){
                alert(`안녕하세요 저는 ${this.name}입니다.`)
            }
        }
        let Person1 = new Person("김선영", 33)

        //         sayhello : function(){
        //             alert(`안녕하세요 저는 ${this.name}입니다.`)
        //         }
        //     }
        // }
        let Person2 =new Person("이은지", 25)
        Person1.sayhello()
        Person2.sayhello()
    </script>
</body>
</html>
